name: Android CI

on:
  push:
    branches: [main, feat/youtube-connector]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Publicar APK debug como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MixTapeMp3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Executar testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace
